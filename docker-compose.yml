services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agframe-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agframe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agframe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agframe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agframe-network

  redis:
    image: redis/redis-stack-server@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    container_name: agframe-redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: --requirepass ${REDIS_PASSWORD:-redissecret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - agframe-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: agframe-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-agframe-local-dev-secret-key-0123456789}
      DB_TYPE: ${DB_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agframe:agframe_secret@postgres:5432/agframe}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-agframe}
      DB_PASSWORD: ${DB_PASSWORD:-agframe_secret}
      DB_NAME: ${DB_NAME:-agframe}
      REDIS_URL: ${REDIS_URL:-redis://:redissecret@redis:6379/0}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://127.0.0.1:3000","http://localhost:3000"]}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-dev-stub}
      MODEL_PATH_EMBEDDING: ${MODEL_PATH_EMBEDDING:-dev-stub}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)); raise SystemExit(0 if data.get('status') == 'ready' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
    networks:
      - agframe-network

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: agframe-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "app.infrastructure.queue.worker_settings.WorkerSettings"]
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-agframe-local-dev-secret-key-0123456789}
      DB_TYPE: ${DB_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agframe:agframe_secret@postgres:5432/agframe}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-agframe}
      DB_PASSWORD: ${DB_PASSWORD:-agframe_secret}
      DB_NAME: ${DB_NAME:-agframe}
      REDIS_URL: ${REDIS_URL:-redis://:redissecret@redis:6379/0}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-dev-stub}
      MODEL_PATH_EMBEDDING: ${MODEL_PATH_EMBEDDING:-dev-stub}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
    networks:
      - agframe-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    container_name: agframe-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - agframe-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: agframe-rabbitmq
    restart: unless-stopped
    hostname: agframe-rabbitmq
    profiles: ["extras"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-agframe}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_secret}
      RABBITMQ_MANAGEMENT_ENABLED: "true"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/defs.json:/etc/rabbitmq/defs.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - agframe-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: agframe-clickhouse
    restart: unless-stopped
    profiles: ["observability"]
    user: "101:101"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_log:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - agframe-network

  minio:
    image: minio/minio:latest
    container_name: agframe-minio
    restart: unless-stopped
    profiles: ["observability"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - agframe-network

  langfuse-server:
    image: langfuse/langfuse:3
    container_name: agframe-langfuse
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-postgresql+psycopg://agframe:agframe_secret@postgres:5432/agframe}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-local-secret-0123456789}
      SALT: ${LANGFUSE_SALT:-langfuse-local-secret-0123456789}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-e5470501e37d01380220b51858dc30d26cdd6ba6ebfc954263aeeb977947a0c5}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      TELEMETRY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD:-redissecret}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${S3_BUCKET:-agframe}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_HOST: ${LANGFUSE_HOST_INTERNAL:-http://langfuse-server:3000}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-org-agframe}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-AgFrame}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-project-agframe}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-AgFrame Project}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@agframe.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-admin123}
    networks:
      - agframe-network

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: agframe-langfuse-worker
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-postgresql+psycopg://agframe:agframe_secret@postgres:5432/agframe}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-local-secret-0123456789}
      SALT: ${LANGFUSE_SALT:-langfuse-local-secret-0123456789}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-e5470501e37d01380220b51858dc30d26cdd6ba6ebfc954263aeeb977947a0c5}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD:-redissecret}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${S3_BUCKET:-agframe}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_HOST: ${LANGFUSE_HOST_INTERNAL:-http://langfuse-server:3000}
    networks:
      - agframe-network

networks:
  agframe-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  clickhouse_data:
  clickhouse_log:
  minio_data:
