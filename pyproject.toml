[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agframe"
version = "0.1.1"
description = "Production-grade lightweight hybrid RAG and agent backend framework"
requires-python = ">=3.11,<3.12"
dependencies = [
    "addict",
    "arq",
    "docx2txt",
    "duckduckgo-search",
    "easydict",
    "einops",
    "faiss-cpu",
    "fastapi",
    "fastapi-limiter==0.1.6",
    "fpdf",
    "httpx",
    "jieba",
    "langchain",
    "langchain-community",
    "langchain-experimental",
    "langchain-huggingface",
    "langchain-openai",
    "langfuse",
    "langgraph",
    "langgraph-checkpoint-redis==0.4.0",
    "langserve[all]",
    "matplotlib",
    "mysql-connector-python",
    "openpyxl",
    "pandas",
    "passlib[bcrypt]",
    "pdf2image",
    "pgvector",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pypdf>=6.9.1",
    "pyjwt",
    "python-dotenv",
    "python-multipart",
    "rank-bm25",
    "redis",
    "requests",
    "sqlalchemy>=2.0.0",
    "streamlit",
    "tiktoken",
    "uvicorn",
]

[dependency-groups]
# Optional dependency groups:
# - document-ai: high-accuracy PDF/Office parsing
# - evals: offline evaluation and benchmarking
# - local-inference: local embeddings / OCR / legacy reranker compatibility
dev = [
    "bandit",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "pytest-json-report",
]
document-ai = [
    "unstructured[all-docs]>=0.21.5,<0.22",
]
evals = [
    "ragas>=0.4.3,<0.5",
]
local-inference = [
    "qwen-vl-utils>=0.0.14,<0.1",
    "sentence-transformers>=5.3.0,<6",
    "timm>=1.0.25,<1.1",
    "torch>=2.10.0,<2.11",
    "torchvision>=0.25.0,<0.26",
    "transformers>=4.46.3,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]
python-preference = "only-managed"
python-downloads = "manual"
required-version = ">=0.10.10,<0.11"

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "langserve.*",
    "pydantic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
